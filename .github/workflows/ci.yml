name: Development CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

concurrency:
  group: development-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'candidate' }}
  cancel-in-progress: true

jobs:
  decision:
    name: Select validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      tree: ${{ steps.decide.outputs.tree }}
      source_run: ${{ steps.decide.outputs.source_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby scripts/ci-evidence.rb decide

  checks:
    needs: decision
    name: Suite analysis, build, and repository checks
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      VALIDATION_MODE: ${{ needs.decision.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Check tooling, localization, and coordinated Suite products
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          mkdir -p build
          {
            xcodebuild -version
            git rev-parse HEAD
            for test in scripts/tests/*_test.rb; do
              /usr/bin/ruby "$test"
            done
            /usr/bin/ruby scripts/update-localizations.rb
            if [[ "$VALIDATION_MODE" == full ]]; then
              bash scripts/check-build.sh --analyze
            fi
          } 2>&1 | tee build/checks.log
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/checks.log
          retention-days: 7

  tests:
    needs: decision
    name: Test ${{ matrix.scheme }}
    # Never expose the development signing key to fork pull requests.
    if: needs.decision.outputs.mode == 'full' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: xcode-27
    timeout-minutes: 30
    environment:
      name: ci-signing
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        scheme: [Core, Write, Research, Composer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Record toolchain and source
        run: |
          mkdir -p build
          {
            sw_vers
            xcodebuild -version
            xcodebuild -showsdks
            git rev-parse HEAD
            echo "Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "Run: ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
          } | tee build/environment.log
      - name: Import dedicated development identity
        env:
          CI_CERTIFICATE_P12_BASE64: ${{ secrets.CI_CERTIFICATE_P12_BASE64 }}
          CI_CERTIFICATE_PASSWORD: ${{ secrets.CI_CERTIFICATE_PASSWORD }}
        run: /usr/bin/ruby scripts/ci-signing.rb import
      - name: Build and test shared scheme
        env:
          CI_SCHEME: ${{ matrix.scheme }}
        run: /usr/bin/ruby scripts/ci.rb build/ci "$CI_SCHEME"
      - name: Remove temporary signing keychain
        if: always()
        run: /usr/bin/ruby scripts/ci-signing.rb cleanup
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.scheme }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/environment.log
            build/ci/*.log
            build/ci/*.xcresult
          retention-days: 7
          if-no-files-found: warn

  suite:
    name: Suite
    if: always()
    needs: [decision, checks, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DECISION_RESULT: ${{ needs.decision.result }}
      VALIDATION_MODE: ${{ needs.decision.outputs.mode }}
      SOURCE_RUN: ${{ needs.decision.outputs.source_run }}
      CHECKS_RESULT: ${{ needs.checks.result }}
      TESTS_RESULT: ${{ needs.tests.result }}
    steps:
      - name: Require successful validation
        run: |
          [[ "$DECISION_RESULT" == success && "$CHECKS_RESULT" == success ]] || exit 1
          case "$VALIDATION_MODE" in
            full)
              [[ "$TESTS_RESULT" == success ]] || exit 1
              ;;
            reuse)
              [[ "$SOURCE_RUN" =~ ^[0-9]+$ && "$TESTS_RESULT" == skipped ]] || exit 1
              echo "Reused full Suite validation from run $SOURCE_RUN."
              ;;
            fast)
              [[ "$TESTS_RESULT" == skipped ]] || exit 1
              echo 'Draft repository checks only; ready PRs require full validation.'
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.decision.outputs.mode == 'full'
        with:
          persist-credentials: false
          submodules: recursive
      - name: Record successful candidate tree
        if: needs.decision.outputs.mode == 'full'
        run: ruby scripts/ci-evidence.rb record validation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.decision.outputs.mode == 'full' && needs.decision.outputs.tree != ''
        with:
          name: validated-tree-${{ needs.decision.outputs.tree }}
          path: validation.json
          retention-days: 7
          overwrite: true
