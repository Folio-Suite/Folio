name: Development build

on:
  push:
    branches: ["dev/**", "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

concurrency:
  group: development-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Development build and repository checks
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Check tooling, localization, and coordinated Suite products
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          mkdir -p build
          {
            xcodebuild -version
            git rev-parse HEAD
            for test in scripts/tests/*_test.rb; do
              /usr/bin/ruby "$test"
            done
            /usr/bin/ruby scripts/update-localizations.rb
            bash scripts/check-build.sh
          } 2>&1 | tee build/checks.log
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/checks.log
          retention-days: 7

